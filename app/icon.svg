<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.2 4 46 46" width="32" height="32">
  <!-- Favicon do Percurso: o P de traço contínuo com a trilha de dois pontos,
       o mesmo desenho do cabeçalho (components/ui/LogoPercurso.tsx). Fundo
       transparente. As cores são as do acento do tema claro (#2d7753) e do
       escuro (#4fc2a0), trocadas pelo esquema do navegador. Cuidado ao editar
       este comentário: dois hífens seguidos invalidam o XML inteiro, e o
       navegador troca o ícone pelo globo. -->
  <style>
    .p { stroke: #2d7753; }
    .t { fill: #2d7753; }
    @media (prefers-color-scheme: dark) {
      .p { stroke: #4fc2a0; }
      .t { fill: #4fc2a0; }
    }
  </style>
  <path class="p" d="M16 35V10.5h11a9.25 9.25 0 0 1 0 18.5H16" fill="none" stroke="#2d7753" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="t" fill="#2d7753" opacity=".55">
    <circle cx="11" cy="40.5" r="2.5"/>
    <circle cx="6.6" cy="44.4" r="1.7"/>
  </g>
</svg>
