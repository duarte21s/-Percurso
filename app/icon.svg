<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Favicon do Percurso: o marcador de página vazado num quadrado de acento,
       a mesma marca do cabeçalho. As cores são as do tema claro e as do escuro
       do site. O quadrado cheio fica porque a aba do navegador não tem fundo
       previsível: com a cor do tema errada, a marca ainda se lê. Cuidado ao
       editar este comentário: dois hífens seguidos invalidam o XML inteiro, e
       o navegador troca o ícone pelo globo. -->
  <style>
    .fundo { fill: #2d7753; }
    .marca { fill: #f8faf7; }
    @media (prefers-color-scheme: dark) {
      .fundo { fill: #4fc2a0; }
      .marca { fill: #05201a; }
    }
  </style>
  <rect class="fundo" width="32" height="32" rx="7.4" fill="#2d7753"/>
  <path class="marca" fill="#f8faf7" fill-rule="evenodd"
        d="M9.7 6.5h12.6v19.3L16 21.1l-6.3 4.7zM16 12a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8z"/>
</svg>
